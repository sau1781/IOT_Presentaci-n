    let currentSlide = 0;

    function renderSlide() {
      const slide = slides[currentSlide];
      if (!slide) return;

      document.getElementById('slideBadge').textContent = slide.badge || '';
      document.getElementById('slideTitle').textContent = slide.title;
      document.getElementById('slideCounter').textContent = `${String(currentSlide + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`;

      const slideBody = document.getElementById('slideBody');
      slideBody.classList.remove('slide-enter');
      void slideBody.offsetWidth;
      slideBody.innerHTML = slide.body;
      slideBody.classList.add('slide-enter');

      const progress = ((currentSlide + 1) / slides.length) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      }
    });

    window.addEventListener('DOMContentLoaded', renderSlide);
  </script>
